<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل طالب</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h2>تعديل بيانات طالب</h2>
    <form onsubmit="updateStudent(event)">
        <input type="number" id="updateId" placeholder="رقم الطالب" required>
        <input type="text" id="updateName" placeholder="الاسم الجديد" required>
        <input type="text" id="updateDepartment" placeholder="القسم الجديد" required>
        <input type="text" id="updateLevel" placeholder="المستوى الجديد" required>
        <input type="number" step="0.01" id="updateGpa" placeholder="المعدل الجديد" required>
        <button type="submit">تعديل</button>
    </form>
    <a href="home.html">رجوع</a>
</div>
<script src="js/script.js"></script>
</body>
</html>
