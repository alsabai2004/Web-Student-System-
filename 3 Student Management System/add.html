<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة طالب</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h2>إضافة طالب جديد</h2>
    <form onsubmit="addStudent(event)">
        <input type="number" id="id" placeholder="رقم الطالب" required>
        <input type="text" id="name" placeholder="اسم الطالب" required>
        <input type="text" id="department" placeholder="القسم" required>
        <input type="text" id="level" placeholder="المستوى" required>
        <input type="number" step="0.01" id="gpa" placeholder="المعدل" required>
        <button type="submit">إضافة</button>
    </form>
    <a href="home.html">رجوع</a>
</div>
<script src="js/script.js"></script>
</body>
</html>
